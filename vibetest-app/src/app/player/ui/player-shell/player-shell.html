<section class="player-shell">
  <header class="player-shell__header">
    <p class="player-shell__context">{{ courseTitle() }} · {{ moduleTitle() }}</p>
  </header>

  <div class="player-shell__outlet">
    @if (step(); as currentStep) {
      <article class="player-shell__step">
        <h2 class="player-shell__step-title">{{ currentStep.title }}</h2>

        @switch (currentStep.type) {
          @case ('theory') {
            @defer {
              <app-theory-step-ui [markdown]="currentStep.content" />
            } @placeholder {
              <p class="player-shell__loading">Загрузка…</p>
            }
          }
          @case ('svg') {
            @defer {
              <app-svg-step-ui [content]="currentStep.content" />
            } @placeholder {
              <p class="player-shell__loading">Загрузка…</p>
            }
          }
          @default {
            <p class="player-shell__placeholder">Step UI — vt-22–23.</p>
          }
        }
      </article>
    }
  </div>
</section>
