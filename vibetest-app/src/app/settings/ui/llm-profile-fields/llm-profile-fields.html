<fieldset class="llm-profile-fields">
  <legend class="llm-profile-fields__legend">Подключение LLM</legend>

  <label class="llm-profile-fields__label">
    Название
    <input
      class="llm-profile-fields__input"
      type="text"
      autocomplete="off"
      [value]="value().label"
      (input)="onFieldInput('label', $event)"
    />
  </label>

  <label class="llm-profile-fields__label">
    Base URL
    <input
      class="llm-profile-fields__input"
      type="url"
      autocomplete="off"
      [value]="value().baseUrl"
      (input)="onFieldInput('baseUrl', $event)"
    />
  </label>

  <label class="llm-profile-fields__label">
    API key
    <input
      class="llm-profile-fields__input"
      type="password"
      autocomplete="off"
      [value]="value().apiKey"
      (input)="onFieldInput('apiKey', $event)"
    />
  </label>

  <label class="llm-profile-fields__label">
    Model
    <input
      class="llm-profile-fields__input"
      type="text"
      autocomplete="off"
      [value]="value().model"
      (input)="onFieldInput('model', $event)"
    />
  </label>

  <label class="llm-profile-fields__label">
    Context Length
    <input
      class="llm-profile-fields__input llm-profile-fields__context-length"
      type="number"
      inputmode="numeric"
      step="1"
      autocomplete="off"
      [min]="minContextLength"
      [value]="value().contextLength ?? ''"
      (input)="onContextLengthInput($event)"
    />
  </label>
  <p class="llm-profile-fields__hint">
    Необязательно. Как в LM Studio (Context Length загруженной модели); нужно для предупреждения
    перед генерацией.
  </p>

  <label class="llm-profile-fields__checkbox">
    <input
      type="checkbox"
      [checked]="value().structuredOutput"
      (change)="onStructuredOutputChange($event)"
    />
    Structured output (json_schema)
  </label>
  <p class="llm-profile-fields__hint">
    Не каждая модель или сервер LM Studio поддерживает большую схему import-DTO.
  </p>
</fieldset>
