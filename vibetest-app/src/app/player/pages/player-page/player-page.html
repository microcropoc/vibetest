<section class="player-page">
  @if (orchestrator.loading()) {
    <p class="player-page__status">Загрузка…</p>
  } @else if (orchestrator.notFound()) {
    <p class="player-page__status">Курс или модуль не найден.</p>
  } @else {
    <app-player-shell
      [courseTitle]="orchestrator.courseTitle()"
      [moduleTitle]="orchestrator.moduleTitle()"
      [step]="orchestrator.currentStep()"
      [snapshot]="orchestrator.currentSnapshot()"
    />
  }
</section>
