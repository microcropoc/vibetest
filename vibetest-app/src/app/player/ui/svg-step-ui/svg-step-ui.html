<div class="svg-step-ui">
  @if (content().caption; as caption) {
    <p class="svg-step-ui__caption">
      <app-markdown-content [markdown]="caption" [inline]="true" />
    </p>
  }

  <div class="svg-step-ui__figure-row">
    <div
      class="svg-step-ui__figure"
      [class.svg-step-ui__figure--empty]="viewerOpen()"
      [attr.aria-hidden]="viewerOpen() ? true : null"
    >
      @if (!viewerOpen()) {
        <div class="svg-step-ui__figure-inner" [innerHTML]="svgHtml()"></div>
      }
    </div>
    <button
      #expandButton
      type="button"
      class="svg-step-ui__expand"
      aria-haspopup="dialog"
      [attr.aria-expanded]="viewerOpen()"
      (click)="onExpand()"
    >
      Развернуть
    </button>
  </div>

  @if (content().description; as description) {
    <app-markdown-content class="svg-step-ui__description" [markdown]="description" />
  }

  <app-svg-fullscreen-viewer
    [open]="viewerOpen()"
    [svgHtml]="svgHtml()"
    [dialogLabel]="viewerDialogLabel()"
    (closed)="onViewerClosed()"
  />
</div>
