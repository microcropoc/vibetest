<div class="app-shell">
  @if (pwaUpdate.updateReady()) {
    <div class="app-shell__update" role="status">
      <span class="app-shell__update-text">Доступна новая версия приложения.</span>
      <button type="button" class="app-shell__update-button" (click)="pwaUpdate.applyUpdate()">
        Обновить
      </button>
    </div>
  }
  <header class="app-shell__header">
    <nav class="app-shell__nav" aria-label="Основная навигация">
      @for (item of navItems; track item.path) {
        <a
          class="app-shell__link"
          routerLinkActive="app-shell__link--active"
          [routerLink]="item.path"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </header>
  <main class="app-shell__main">
    <router-outlet />
  </main>
</div>
