<article class="course-statistics-card">
  <h2 class="course-statistics-card__title">{{ item().title }}</h2>
  <p class="course-statistics-card__line">
    Модули: {{ item().completedModules }} / {{ item().totalModules }} пройдено
  </p>
  <p class="course-statistics-card__line">
    Шаги: {{ item().completedSteps }} / {{ item().totalSteps }} пройдено
  </p>
</article>
