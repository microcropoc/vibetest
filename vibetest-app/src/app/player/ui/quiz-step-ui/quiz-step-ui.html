<div class="quiz-step-ui">
  <p class="quiz-step-ui__question">{{ step().content.question }}</p>

  @if (showFailure()) {
    <p class="quiz-step-ui__error" role="alert">Неверный ответ. Попробуйте снова или нажмите «Повторить».</p>
  }

  <fieldset class="quiz-step-ui__options">
    <legend class="quiz-step-ui__legend">Варианты ответа</legend>
    @for (option of step().content.options; track $index) {
      <label class="quiz-step-ui__option">
        @if (multipleChoice()) {
          <input
            type="checkbox"
            class="quiz-step-ui__input"
            [checked]="isSelected($index)"
            (change)="onCheckboxChange($index, $any($event.target).checked)"
          />
        } @else {
          <input
            type="radio"
            class="quiz-step-ui__input"
            [name]="step().stepId"
            [checked]="isSelected($index)"
            (change)="onRadioChange($index)"
          />
        }
        <span class="quiz-step-ui__label">{{ option }}</span>
      </label>
    }
  </fieldset>

  <button
    type="button"
    class="quiz-step-ui__submit"
    [disabled]="!canSubmit()"
    (click)="onSubmit()"
  >
    Проверить
  </button>
</div>
